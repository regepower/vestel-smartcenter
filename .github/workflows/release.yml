name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/vestel_smartcenter/manifest.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Zip integration
        run: cd custom_components/vestel_smartcenter && zip -r ../../vestel_smartcenter.zip . -x '__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" vestel_smartcenter.zip --title "${GITHUB_REF_NAME}" --generate-notes
