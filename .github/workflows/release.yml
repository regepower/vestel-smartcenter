name: Release

# Creates tag + GitHub release "v<version>" whenever manifest.json on main has a new version.
# HACS then shows the version instead of the commit hash.
on:
  push:
    branches: [main]
    paths: [custom_components/vestel_smartcenter/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          echo "tag=v$(jq -r .version custom_components/vestel_smartcenter/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Zip integration
        run: cd custom_components/vestel_smartcenter && zip -r ../../vestel_smartcenter.zip . -x '__pycache__/*'
      - name: Create release (skip if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists"; exit 0; fi
          gh release create "$TAG" vestel_smartcenter.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
